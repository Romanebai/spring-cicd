name: Checkstyle report

on:
  workflow_dispatch:

jobs:
  checkstyle:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Construire avec Maven
        run: mvn -B clean verify -Dspring.profiles.active=test -Dmaven.test.failure.ignore=true

      - name: Générer le site Maven
        run: mvn site

      - name: Publier le rapport Checkstyle
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: target/site/