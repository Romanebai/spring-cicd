name: Configuration Java

on:
  workflow_dispatch:

jobs:
  affichage:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le repository
        uses: actions/checkout@v5

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Afficher la version de java
        run: java -version

      - name: Afficher la version de Maven
        run: mvn -version

      - name: Afficher les fichiers
        run: ls -al
